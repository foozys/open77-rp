<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>HUD</title>
<style>
  :root {
    --cash: #f3e600;
    --bank: #5ef6ff;
    --up: #78dc8c;
    --down: #eb6e6e;
    --shadow: 0 0 6px rgba(0, 0, 0, 0.85), 0 0 2px rgba(0, 0, 0, 0.9);
  }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif; }

  /* Справа под мини-картой. */
  #money { position: absolute; top: 312px; right: 64px; text-align: right;
    opacity: 0; transition: opacity 0.4s; }
  #money.visible { opacity: 1; }
  .row { display: flex; justify-content: flex-end; align-items: baseline; gap: 10px;
    text-shadow: var(--shadow); white-space: nowrap; }
  .label { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.75; }
  #cash { color: var(--cash); font-size: 30px; font-weight: 700; letter-spacing: 1px; }
  .bank { color: var(--bank); margin-top: 2px; }
  #bank { font-size: 20px; font-weight: 600; }
  #job { margin-top: 10px; display: none; text-shadow: var(--shadow); color: #e8f1f2; }
  #job.visible { display: block; }
  #jobLabel { font-size: 15px; font-weight: 600; }
  #jobRank { font-size: 13px; opacity: 0.75; }
  #duty { display: inline-block; margin-left: 8px; padding: 1px 7px; font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase; border: 1px solid currentColor; vertical-align: 2px; }
  #duty.on { color: var(--up); }
  #duty.off { color: #8fa3a8; }
  #needs { margin-top: 12px; display: none; width: 200px; margin-left: auto; }
  #needs.visible { display: block; }
  .need { display: flex; align-items: center; gap: 8px; margin-top: 5px; text-shadow: var(--shadow); }
  .need .label { width: 46px; text-align: right; font-size: 11px; color: #e8f1f2; }
  .need .bar { flex: 1; height: 6px; background: rgba(0, 0, 0, 0.55); box-shadow: 0 0 3px rgba(0, 0, 0, 0.8); }
  .need .fill { height: 100%; transition: width 0.6s; }
  #hungerFill { background: #f0a020; }
  #thirstFill { background: #3fa9f5; }
  .need.low .fill { animation: blink 1s steps(2, start) infinite; }
  .need.low .fill { background: var(--down); }
  @keyframes blink { to { opacity: 0.35; } }
  .delta { position: absolute; right: 0; font-size: 18px; font-weight: 700; text-shadow: var(--shadow);
    animation: rise 2.4s ease-out forwards; pointer-events: none; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  @keyframes rise {
    0% { opacity: 0; transform: translateY(0); }
    10% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-26px); }
  }
</style>
</head>
<body>
<div id="money">
  <div class="row"><span id="cash"></span></div>
  <div class="row bank"><span class="label">Счёт</span><span id="bank"></span></div>
  <div id="job">
    <div class="row"><span id="jobLabel"></span><span id="duty"></span></div>
    <div class="row"><span id="jobRank"></span></div>
  </div>
  <div id="needs">
    <div class="need" id="hunger"><span class="label">Еда</span><div class="bar"><div class="fill" id="hungerFill"></div></div></div>
    <div class="need" id="thirst"><span class="label">Вода</span><div class="bar"><div class="fill" id="thirstFill"></div></div></div>
  </div>
</div>

<script>
  const CURRENCY = "€$";
  const $ = id => document.getElementById(id);
  let last = null;

  function format(amount) {
    const sign = amount < 0 ? "-" : "";
    const digits = String(Math.abs(Math.trunc(amount))).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    return `${sign}${digits} ${CURRENCY}`;
  }

  // Всплывающее +/- рядом со строкой, чьё значение изменилось.
  function flash(anchor, delta) {
    if (!delta) return;
    const node = document.createElement("div");
    node.className = `delta ${delta > 0 ? "up" : "down"}`;
    node.textContent = (delta > 0 ? "+" : "") + format(delta);
    node.style.top = `${anchor.offsetTop + anchor.offsetHeight}px`;
    $("money").append(node);
    setTimeout(() => node.remove(), 2500);
  }

  function renderMoney(money) {
    const box = $("money");
    if (!money) {
      box.classList.remove("visible");
      last = null;
      return;
    }
    $("cash").textContent = format(money.cash);
    $("bank").textContent = format(money.bank);
    box.classList.add("visible");
    if (last) {
      flash($("cash").parentElement, money.cash - last.cash);
      flash($("bank").parentElement, money.bank - last.bank);
    }
    last = { cash: money.cash, bank: money.bank };
  }

  function renderJob(job) {
    $("job").classList.toggle("visible", !!job);
    if (!job) return;
    $("jobLabel").textContent = job.label;
    $("jobRank").textContent = job.rank;
    const duty = $("duty");
    duty.textContent = job.duty ? "на смене" : "не на смене";
    duty.className = job.duty ? "on" : "off";
  }

  function renderNeeds(needs) {
    $("needs").classList.toggle("visible", !!needs);
    if (!needs) return;
    for (const key of ["hunger", "thirst"]) {
      const value = Math.max(0, Math.min(100, needs[key]));
      $(`${key}Fill`).style.width = `${value}%`;
      $(key).classList.toggle("low", value <= 20);
    }
  }

  Open77.on("hud:state", state => {
    renderMoney(state && state.money);
    renderJob(state && state.money && state.job);
    renderNeeds(state && state.money && state.needs);
  });
  Open77.ready();
</script>
</body>
</html>
