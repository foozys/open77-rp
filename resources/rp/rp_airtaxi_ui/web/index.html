<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Аэротакси</title>
<style>
  :root {
    --bg: rgba(10, 12, 18, 0.94);
    --line: rgba(120, 200, 255, 0.3);
    --accent: #78c8ff;
    --money: #f3e600;
    --warn: #ff5e6c;
    --text: #e8f1f2;
    --muted: #8fa3a8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
    font: 16px/1.35 "Segoe UI", Arial, sans-serif; user-select: none; }
  #root { display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); }
  #root.open { display: block; }
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 600px;
    padding: 24px 26px; background: var(--bg); border: 1px solid var(--line); border-top: 3px solid var(--accent);
    max-height: 88vh; display: flex; flex-direction: column; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  #wallet { font-size: 14px; color: var(--muted); }
  #wallet b { color: var(--money); font-size: 18px; }
  #from { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  #routes { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-right: 6px; }
  #routes::-webkit-scrollbar { width: 6px; }
  #routes::-webkit-scrollbar-thumb { background: var(--line); }
  .route { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid rgba(255, 255, 255, 0.08); }
  .route .name { flex: 1; }
  .route .name small { display: block; color: var(--muted); font-size: 12px; }
  .route .price { width: 90px; text-align: right; font-weight: 600; }
  .empty { color: var(--muted); padding: 10px 0; }
  button { padding: 7px 14px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  button:hover { background: rgba(120, 200, 255, 0.12); }
  button:disabled { opacity: 0.4; cursor: default; }
  #message { min-height: 22px; margin-top: 14px; font-size: 14px; }
  #message.ok { color: var(--accent); }
  #message.bad { color: var(--warn); }
  .hint { margin-top: 10px; color: var(--muted); font-size: 12px; }

  /* Экран полёта: чёрный, маршрут и полоска времени. */
  #flight { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none;
    transition: opacity 1s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #flight.on { opacity: 1; }
  #flight .tag { color: var(--accent); letter-spacing: 6px; font-size: 14px; text-transform: uppercase; }
  #flight .route { border: none; font-size: 30px; letter-spacing: 2px; margin: 14px 0 26px; gap: 18px; }
  #flight .route span.arrow { color: var(--accent); }
  #flight .track { width: 420px; height: 3px; background: rgba(255, 255, 255, 0.1); }
  #flight .fill { height: 100%; width: 0; background: var(--accent); }
  #flight .note { margin-top: 14px; color: var(--muted); font-size: 13px; }
  #toast { position: absolute; left: 50%; bottom: 140px; transform: translateX(-50%); padding: 8px 16px;
    background: var(--bg); border: 1px solid var(--line); color: var(--accent); font-size: 15px; display: none; }
  #toast.on { display: block; }
  #toast.bad { color: var(--warn); }
</style>
</head>
<body>
<div id="root">
  <div id="panel">
    <header>
      <h1>Аэротакси</h1>
      <div id="wallet">На счёте <b id="bank"></b></div>
    </header>
    <div id="from"></div>
    <div id="routes"></div>
    <div id="message"></div>
    <div class="hint">Оплата со счёта при посадке · Esc — закрыть</div>
  </div>
</div>
<div id="flight">
  <div class="tag">Аэротакси · в полёте</div>
  <div class="route"><span id="fFrom"></span><span class="arrow">→</span><span id="fTo"></span></div>
  <div class="track"><div class="fill"></div></div>
  <div class="note">Не выходите из игры до посадки</div>
</div>
<div id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  const money = n => `${String(Math.trunc(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ")} €$`;
  let busy = false;

  function setBusy(value) {
    busy = value;
    document.querySelectorAll("#routes button").forEach(b => { b.disabled = value; });
  }

  function message(text, ok) {
    const node = $("message");
    node.textContent = text || "";
    node.className = text ? (ok ? "ok" : "bad") : "";
  }

  function renderRoutes(routes) {
    const list = $("routes");
    list.replaceChildren();
    if (!routes.length) {
      const none = document.createElement("div");
      none.className = "empty";
      none.textContent = "Других площадок нет.";
      list.append(none);
      return;
    }
    for (const r of routes) {
      const row = document.createElement("div");
      row.className = "route";
      row.innerHTML = `<div class="name"><span></span><small></small></div><div class="price"></div><button>Лететь</button>`;
      row.querySelector(".name span").textContent = r.name;
      row.querySelector(".name small").textContent = `${r.km} км · полёт ${r.seconds} с`;
      row.querySelector(".price").textContent = money(r.price);
      row.querySelector("button").addEventListener("click", () => {
        if (busy) return;
        setBusy(true);
        message("");
        Open77.emit("air:fly", { id: r.id });
      });
      list.append(row);
    }
  }

  let toastTimer = null;
  function toast(text, ok) {
    const node = $("toast");
    node.textContent = text;
    node.className = ok ? "on" : "on bad";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { node.className = ""; }, 4000);
  }

  document.addEventListener("keydown", e => {
    if (!$("root").classList.contains("open")) return;
    if (e.key === "Escape") { e.preventDefault(); Open77.emit("air:close", {}); }
  });

  Open77.on("air:show", p => {
    $("bank").textContent = money(p.bank || 0);
    $("from").textContent = `Площадка: ${p.from || ""}`;
    renderRoutes(Array.isArray(p.routes) ? p.routes : []);
    message("");
    setBusy(false);
    $("root").classList.add("open");
  });
  Open77.on("air:result", p => {
    message(p.text, p.ok);
    setBusy(false);
  });
  Open77.on("air:close", () => $("root").classList.remove("open"));

  Open77.on("air:depart", p => {
    $("root").classList.remove("open");
    $("fFrom").textContent = p.from || "";
    $("fTo").textContent = p.to || "";
    const fill = document.querySelector("#flight .fill");
    fill.style.transition = "none";
    fill.style.width = "0";
    $("flight").classList.add("on");
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fill.style.transition = `width ${Math.max(0, p.ms || 0)}ms linear`;
      fill.style.width = "100%";
    }));
  });
  Open77.on("air:arrive", p => {
    $("flight").classList.remove("on");
    if (p.text) toast(p.text, p.ok);
  });

  Open77.ready();
</script>
</body>
</html>
