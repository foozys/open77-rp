<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NetOS</title>
<style>
  :root {
    --bg: #070b10; --panel: rgba(12, 18, 26, 0.96); --line: rgba(94, 246, 255, 0.22); --line2: rgba(94, 246, 255, 0.1);
    --accent: #5ef6ff; --accent2: #ff3d7f; --money: #f3e600; --ok: #78dc8c; --warn: #ff5e6c;
    --text: #e3f4f6; --muted: #7f97a0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
    font: 15px/1.4 "Segoe UI", Arial, sans-serif; }
  #root { display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.55); }
  #root.open { display: block; animation: boot 0.35s ease-out; }
  @keyframes boot { from { opacity: 0; filter: brightness(2.5) blur(2px); } to { opacity: 1; filter: none; } }
  #screen { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at 30% 0%, #0f2230 0%, var(--bg) 55%); border: 2px solid #1d2a33;
    box-shadow: 0 0 0 10px #0b1015, 0 0 0 12px #26333c, 0 0 60px rgba(94, 246, 255, 0.18);
    display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 54px 1fr; overflow: hidden; }
  #screen::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0 1px, transparent 1px 3px); }
  #top { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; padding: 0 18px;
    border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); }
  #logo { font-weight: 800; letter-spacing: 4px; color: var(--accent); font-size: 20px; }
  #logo span { color: var(--accent2); }
  #who { color: var(--muted); font-size: 13px; }
  #who b { color: var(--text); }
  #bank { margin-left: auto; font-size: 13px; color: var(--muted); }
  #bank b { color: var(--money); font-size: 16px; }
  #clock { font-family: Consolas, monospace; color: var(--accent); }
  #dock { border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 4px;
    background: rgba(0, 0, 0, 0.2); }
  #dock button { display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; border: 1px solid transparent;
    background: transparent; color: var(--text); font: inherit; cursor: pointer; letter-spacing: 0.5px; }
  #dock button:hover { background: rgba(94, 246, 255, 0.06); }
  #dock button.sel { border-color: var(--line); background: rgba(94, 246, 255, 0.1); color: var(--accent); }
  #dock .ic { width: 22px; text-align: center; font-family: Consolas, monospace; color: var(--accent2); }
  #dock .badge { margin-left: auto; min-width: 20px; padding: 0 6px; border-radius: 10px; background: var(--accent2);
    color: #fff; font-size: 11px; text-align: center; }
  #dock .badge:empty { display: none; }
  #dock .spacer { flex: 1; }
  #app { position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--line2); }
  .bar h2 { margin: 0 12px 0 0; font-size: 17px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  .body { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px; }
  .split { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px 1fr; }
  .split > div { min-height: 0; overflow: auto; }
  .split > div:first-child { border-right: 1px solid var(--line2); }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: var(--line); }
  button.b { padding: 6px 14px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 12px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  button.b:hover { background: rgba(94, 246, 255, 0.12); }
  button.b.pink { border-color: var(--accent2); color: var(--accent2); }
  button.b.ghost { border-color: rgba(255, 255, 255, 0.15); color: var(--muted); }
  button.b.sel { background: rgba(94, 246, 255, 0.16); }
  button.b:disabled { opacity: 0.4; cursor: default; }
  input, textarea, select { width: 100%; padding: 8px 10px; background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line);
    color: var(--text); font: inherit; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 90px; }
  label.f { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .row { padding: 10px 14px; border-bottom: 1px solid var(--line2); cursor: pointer; }
  .row:hover { background: rgba(94, 246, 255, 0.05); }
  .row.sel { background: rgba(94, 246, 255, 0.1); }
  .row.unread b { color: var(--accent); }
  .row small, .muted { color: var(--muted); font-size: 12px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .card { border: 1px solid var(--line2); background: var(--panel); padding: 14px 16px; margin-bottom: 12px; }
  .pre { white-space: pre-wrap; word-break: break-word; }
  .flex { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  /* мессенджер */
  .thread { display: flex; flex-direction: column; height: 100%; }
  .msgs { flex: 1; overflow: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; }
  .bubble { max-width: 70%; padding: 8px 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line2);
    white-space: pre-wrap; word-break: break-word; }
  .bubble.mine { align-self: flex-end; background: rgba(94, 246, 255, 0.12); border-color: var(--line); }
  .bubble small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .composer { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line2); }
  /* НайтКом */
  .feed { max-width: 820px; margin: 0 auto; }
  .post .head { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .post .nick { color: var(--accent2); font-weight: 700; cursor: pointer; }
  .post .acts { display: flex; gap: 8px; margin-top: 10px; }
  .post .comments { margin-top: 10px; border-top: 1px solid var(--line2); padding-top: 8px; }
  .comment { padding: 4px 0; font-size: 14px; }
  .comment b { color: var(--accent); }
  /* браузер */
  .addr { flex: 1; font-family: Consolas, monospace; }
  .dir h3 { margin: 18px 0 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent2); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tile { border: 1px solid var(--line2); padding: 0 0 12px; cursor: pointer; background: rgba(0, 0, 0, 0.25); overflow: hidden; }
  .tile > b, .tile > code, .tile > div.muted { margin: 0 14px; }
  .tcover { height: 120px; margin-bottom: 10px; background: linear-gradient(135deg, #1a0b2a, #04121c) center / cover no-repeat;
    border-bottom: 1px solid var(--line2); }
  .tcover.noimg { background: linear-gradient(135deg, #1a0b2a, #04121c); }
  .coverpick { height: 110px; border: 1px dashed var(--line); background: rgba(0, 0, 0, 0.3) center / cover no-repeat;
    display: grid; place-items: center; font-size: 12px; opacity: 0.85; margin-bottom: 6px; }
  .listing { font-size: 12px; } .listing.on { color: var(--ok); } .listing.off { color: var(--warn); }
  .tile:hover { border-color: var(--accent); }
  .tile b { display: block; } .tile code { color: var(--accent); font-size: 12px; }
  .site { min-height: 100%; padding: 30px 40px; }
  .site .hero { padding: 26px 30px; margin: -30px -40px 24px; position: relative; }
  .site .hero.cover { min-height: 170px; display: flex; flex-direction: column; justify-content: flex-end;
    background-size: cover !important; background-position: center !important; }
  .site .hero.cover h1, .site .hero.cover p { text-shadow: 0 2px 8px #000; color: #fff; }
  .site .hero h1 { margin: 0; font-size: 38px; letter-spacing: 2px; }
  .site .hero p { margin: 6px 0 0; opacity: 0.8; }
  .site h3 { font-size: 22px; margin: 22px 0 8px; }
  .site .price { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.15); max-width: 640px; }
  .site blockquote { margin: 12px 0; padding: 10px 16px; border-left: 3px solid currentColor; opacity: 0.85; font-style: italic; }
  .site .contact { margin-top: 16px; padding: 10px 14px; border: 1px solid rgba(255, 255, 255, 0.2); display: inline-block; }
  .site .ads { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .site .ad { padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.25); background: rgba(0, 0, 0, 0.35); font-size: 13px; }
  .site .ad .tag { font-size: 10px; letter-spacing: 2px; opacity: 0.6; }
  .site .ad.link { cursor: pointer; }
  .site .shop { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .site .good { padding: 12px 14px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.35); }
  .site .good .p { color: var(--money); font-weight: 700; margin: 6px 0; }
  .site .good input { width: 64px; text-align: center; }
  .theme-neon { background: linear-gradient(160deg, #12001f, #04121c); color: #f2eaff; }
  .theme-neon .hero { background: linear-gradient(90deg, #ff3d7f55, #5ef6ff33); border-bottom: 2px solid #ff3d7f; }
  .theme-neon h3 { color: #ff7bb0; }
  .theme-chrome { background: linear-gradient(180deg, #d9dee2, #9aa4ab); color: #11161a; }
  .theme-chrome .hero { background: linear-gradient(90deg, #ffffff, #b8c2c8); border-bottom: 2px solid #11161a; }
  .theme-chrome .ad, .theme-chrome .good { background: rgba(255, 255, 255, 0.5); border-color: #11161a55; }
  .theme-noir { background: #050505; color: #d8d2c4; font-family: Georgia, serif; }
  .theme-noir .hero { background: #111; border-bottom: 1px solid #a8893f; } .theme-noir h3 { color: #c9a95a; }
  .theme-corpo { background: #0b1421; color: #dbe7f5; }
  .theme-corpo .hero { background: linear-gradient(90deg, #12355e, #0b1421); border-bottom: 3px solid #f3e600; }
  .theme-corpo h3 { color: #f3e600; letter-spacing: 1px; text-transform: uppercase; font-size: 18px; }
  .theme-street { background: #1a1406; color: #f5ead0; }
  .theme-street .hero { background: repeating-linear-gradient(45deg, #f3e600 0 18px, #1a1406 18px 36px); color: #1a1406; }
  .theme-street .hero h1, .theme-street .hero p { background: #f3e600; display: inline-block; padding: 0 8px; }
  .theme-street h3 { color: #f3e600; }
  /* конструктор */
  .blk { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px; align-items: start; padding: 8px; border: 1px solid var(--line2); margin-bottom: 6px; }
  .blk .k { font-size: 12px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; padding-top: 8px; }
  .blk .ops { display: flex; flex-direction: column; gap: 4px; }
  .blk .ops button { padding: 3px 8px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.t td, table.t th { padding: 8px 10px; border-bottom: 1px solid var(--line2); text-align: left; vertical-align: top; }
  table.t th { color: var(--muted); font-weight: 400; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .st-active { color: var(--ok); } .st-pending { color: var(--money); } .st-rejected, .st-cancelled, .st-paused { color: var(--warn); }
  /* сетка страницы (конструктор v2) */
  .srow { display: grid; gap: 22px; margin: 6px 0 18px; align-items: start; }
  .cols-1 { grid-template-columns: 1fr; } .cols-2 { grid-template-columns: 1fr 1fr; } .cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .cols-2-1 { grid-template-columns: 2fr 1fr; } .cols-1-2 { grid-template-columns: 1fr 2fr; }
  .scol { min-width: 0; }
  .site hr.divider { border: none; border-top: 1px solid currentColor; opacity: 0.25; margin: 18px 0; }
  .site .sitebtn { display: inline-block; margin: 8px 0; padding: 10px 22px; border: 2px solid currentColor; cursor: pointer;
    font-weight: 700; letter-spacing: 1px; text-transform: uppercase; font-size: 13px; }
  .site .sitebtn:hover { opacity: 0.8; }
  .site figure.fig { margin: 8px 0; }
  .site figure.fig img { width: 100%; display: block; background: rgba(0, 0, 0, 0.3); }
  .site figure.size-s img { height: 160px; } .site figure.size-m img { height: 280px; } .site figure.size-l img { height: 440px; }
  .site figure.fit-cover img { object-fit: cover; } .site figure.fit-contain img { object-fit: contain; }
  .site figure .ph { height: 160px; display: grid; place-items: center; border: 1px dashed currentColor; opacity: 0.5; }
  .site figcaption { font-size: 13px; opacity: 0.75; margin-top: 6px; }
  /* баннер рекламы */
  .banner { position: relative; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.18); margin: 8px 0; }
  .banner.wide { width: 100%; min-height: 130px; }
  .banner.square { width: 260px; height: 260px; max-width: 100%; }
  .banner .bimg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.55; }
  .banner .binner { position: relative; padding: 16px 20px; display: flex; flex-direction: column; gap: 6px; height: 100%; }
  .banner.square .binner { justify-content: flex-end; }
  .banner .btag { font-size: 10px; letter-spacing: 3px; opacity: 0.6; }
  .banner .btitle { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .banner .btext { font-size: 14px; opacity: 0.9; }
  .banner .bcta { align-self: flex-start; margin-top: 4px; padding: 6px 14px; color: #000; font-weight: 700; font-size: 12px;
    letter-spacing: 1px; text-transform: uppercase; }
  .banner.link { cursor: pointer; } .banner.link:hover { filter: brightness(1.15); }
  .font-mono { font-family: Consolas, monospace; } .font-display .btitle { font-size: 32px; text-transform: uppercase; letter-spacing: 2px; }
  .adcell .banner.wide { width: 360px; min-height: 90px; } .adcell .banner.square { width: 150px; height: 150px; }
  .adcell .banner .btitle { font-size: 16px; } .adcell .banner .btext { font-size: 12px; }
  .adform { margin-top: 26px; color: var(--text); font-family: "Segoe UI", Arial, sans-serif; }
  .adgrid { display: grid; grid-template-columns: 420px 1fr; gap: 20px; margin-top: 10px; }
  .adpreview { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 10px; align-self: start; }
  .cols-3 .font-display .btitle, .cols-2-1 .scol:last-child .font-display .btitle, .cols-1-2 .scol:first-child .font-display .btitle { font-size: 22px; }
  .cfield .swatches { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .sw { width: 20px; height: 20px; border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer; }
  .sw.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatches .hex { width: 90px; padding: 3px 6px; font-family: Consolas, monospace; font-size: 12px; }
  /* редактор */
  .editor { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px 1fr; }
  .eside { overflow: auto; padding: 12px; border-right: 1px solid var(--line2); }
  .ecanvas { overflow: auto; }
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pitem { padding: 8px 10px; border: 1px solid var(--line); cursor: grab; font-size: 13px; background: rgba(0, 0, 0, 0.3); }
  .pitem:hover { border-color: var(--accent); color: var(--accent); }
  .erow { border: 1px dashed rgba(255, 255, 255, 0.14); padding: 6px 8px 0; margin: 10px 0; }
  .ebar { display: flex; gap: 4px; align-items: center; margin-bottom: 4px; }
  .ebar button { padding: 2px 8px; font-size: 11px; }
  .ecol { min-height: 70px; padding: 6px; border: 1px dashed rgba(255, 255, 255, 0.12); }
  .ecol.target { border-color: var(--accent); }
  .eblk { position: relative; padding: 4px 6px; border: 1px solid transparent; cursor: grab; }
  .eblk:hover { border-color: rgba(94, 246, 255, 0.35); }
  .eblk.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .eblk.dragging { opacity: 0.35; }
  .eblk .etag { position: absolute; top: -9px; right: 6px; font: 10px/1 "Segoe UI", Arial; letter-spacing: 1px; padding: 2px 5px;
    background: #071016; color: var(--accent); border: 1px solid var(--line); opacity: 0; pointer-events: none; }
  .eblk:hover .etag, .eblk.sel .etag { opacity: 1; }
  .dragghost { position: fixed; z-index: 20; pointer-events: none; padding: 6px 12px; background: rgba(7, 16, 22, 0.92);
    border: 1px solid var(--accent2); color: var(--accent2); font-size: 13px; letter-spacing: 1px; box-shadow: 0 0 12px rgba(255, 61, 127, 0.4); }
  .site.edit, .site.edit *, .palette, .pitem { user-select: none; }
  .dropline { height: 3px; background: var(--accent2); margin: 2px 0; box-shadow: 0 0 6px var(--accent2); }
  .ehint { padding: 18px; text-align: center; opacity: 0.4; font-size: 13px; }
  .adslot .adnote { font-size: 12px; opacity: 0.7; }
  .adpick { padding: 8px 10px; border: 1px solid var(--line2); margin-top: 6px; cursor: pointer; }
  .adpick.sel { border-color: var(--accent); background: rgba(94, 246, 255, 0.08); }
  .adpick.used { opacity: 0.4; cursor: default; }
  #toast { position: absolute; right: 24px; bottom: 22px; max-width: 520px; padding: 12px 16px; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid var(--accent); opacity: 0; transform: translateY(10px);
    transition: 0.2s; pointer-events: none; z-index: 5; }
  #toast.on { opacity: 1; transform: none; }
  #toast.bad { border-left-color: var(--warn); }
</style>
</head>
<body>
<div id="root">
  <div id="screen">
    <div id="top">
      <div id="logo">NET<span>//</span>OS</div>
      <div id="who"></div>
      <div id="bank"></div>
      <div id="clock"></div>
      <button class="b ghost" id="quit">Отключиться</button>
    </div>
    <div id="dock"></div>
    <div id="app"></div>
    <div id="toast"></div>
  </div>
</div>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  // Пользовательский текст — только textContent: никакого HTML из сети.
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  const btn = (text, cls, on) => { const b = el("button", "b " + (cls || ""), text); if (on) b.addEventListener("click", on); return b; };
  const money = n => (Number(n) || 0).toLocaleString("ru-RU") + " €$";
  const when = t => {
    if (!t) return "";
    const d = new Date(t * 1000);
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " +
      d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  };

  // -- связь с сервером: запрос → ответ по номеру ------------------------------------------
  let seq = 0;
  const waiting = new Map();
  const api = (action, args) => new Promise(resolve => {
    const id = ++seq;
    const timer = setTimeout(() => { waiting.delete(id); resolve({ ok: false, data: "Сеть не отвечает." }); }, 12000);
    waiting.set(id, r => { clearTimeout(timer); resolve(r); });
    Open77.emit("net:req", { id, action, args: args || {} });
  });
  // Lua не отличает пустой список от пустого объекта: {} в ответе — это пустой список.
  const fixEmpty = v => {
    if (Array.isArray(v)) return v.map(fixEmpty);
    if (v && typeof v === "object") {
      const keys = Object.keys(v);
      if (!keys.length) return [];
      for (const k of keys) v[k] = fixEmpty(v[k]);
    }
    return v;
  };
  Open77.on("net:res", r => {
    const done = waiting.get(r.id);
    if (done) { waiting.delete(r.id); done({ ...r, data: fixEmpty(r.data) }); }
  });
  // Ответ с ошибкой — тост и null.
  const ask = async (action, args) => {
    const r = await api(action, args);
    if (!r.ok) { toast(typeof r.data === "string" ? r.data : "Не получилось.", true); return null; }
    return r.data || {};
  };

  // Большие аргументы (страница сайта) — частями по 5000 символов, затем само действие.
  const askBig = async (action, args) => {
    const text = JSON.stringify(args);
    if (text.length <= 5000) return ask(action, args);
    const parts = [];
    for (let at = 0; at < text.length;) {
      let end = Math.min(text.length, at + 4990);
      const code = text.charCodeAt(end - 1);
      if (end < text.length && code >= 0xd800 && code <= 0xdbff) end--;   // не резать пару (эмодзи)
      parts.push(text.slice(at, end));
      at = end;
    }
    for (let i = 0; i < parts.length; i++) {
      if (!await ask("big_part", { index: i + 1, total: parts.length, data: parts[i] })) return null;
    }
    return ask(action, { big: true });
  };

  let toastTimer;
  const toast = (text, bad) => {
    const t = $("toast");
    t.textContent = text;
    t.className = "on" + (bad ? " bad" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = bad ? "bad" : ""; }, 4200);
  };

  // -- оболочка ---------------------------------------------------------------------------
  let me = {};
  const APPS = [
    { id: "mail", ic: "@", label: "Почта" },
    { id: "msg", ic: "✉", label: "Мессенджер" },

  // -- фото: кэш, загрузка частями -----------------------------------------------------------
  // Картинки приходят с сервера по номеру (img_get, до 3 за раз) и кэшируются на время сеанса.
  const imgCache = new Map();
  const imgWait = new Map();     // id → [resolve]
  let imgQueue = [], imgPumping = false;
  // Данные фото приходят отдельно кусками (net:img), ответ img_get — только номера и число кусков.
  const imgParts = new Map();    // id → { total, parts, got }
  const imgArrived = new Map();  // id → resolve
  Open77.on("net:img", m => {
    if (!m || !m.id) return;
    let e = imgParts.get(m.id);
    if (!e || e.total !== m.total) { e = { total: m.total, parts: [], got: 0 }; imgParts.set(m.id, e); }
    if (!e.parts[m.index - 1]) e.got++;
    e.parts[m.index - 1] = m.data;
    if (e.got >= e.total) {
      imgParts.delete(m.id);
      imgCache.set(m.id, e.parts.join(""));
      const done = imgArrived.get(m.id);
      if (done) { imgArrived.delete(m.id); done(); }
    }
  });
  const waitImage = id => new Promise(resolve => {
    if (imgCache.has(id)) return resolve();
    const timer = setTimeout(() => { imgArrived.delete(id); resolve(); }, 20000);
    imgArrived.set(id, () => { clearTimeout(timer); resolve(); });
  });
  const pumpImages = async () => {
    if (imgPumping) return;
    imgPumping = true;
    while (imgQueue.length) {
      const ids = imgQueue.splice(0, 3);
      const r = await api("img_get", { ids });
      const list = r.ok && r.data && Array.isArray(r.data.images) ? r.data.images : [];
      await Promise.all(list.map(im => waitImage(im.id)));
      for (const id of ids) {
        const waiters = imgWait.get(id) || [];
        imgWait.delete(id);
        for (const done of waiters) done(imgCache.get(id) || null);
      }
    }
    imgPumping = false;
  };
  const loadImage = id => new Promise(resolve => {
    if (imgCache.has(id)) return resolve(imgCache.get(id));
    if (!imgWait.has(id)) { imgWait.set(id, []); imgQueue.push(id); }
    imgWait.get(id).push(resolve);
    setTimeout(pumpImages, 20);
  });
  const setImg = (node, id, asBackground) => {
    const apply = data => {
      if (!data) { node.classList.add("noimg"); return; }
      if (asBackground) node.style.backgroundImage = `url("${data}")`; else node.src = data;

  // Файл с ПК → JPEG не длиннее ~72 000 символов → частями на сервер. Номер фото или null.
  const MAX_IMG_CHARS = 72000, PART = 15000;
  const shrink = src => new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      let scale = Math.min(1, 1280 / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      for (let pass = 0; pass < 8; pass++) {
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        for (const q of [0.82, 0.7, 0.6, 0.5, 0.42]) {
          const out = canvas.toDataURL("image/jpeg", q);
          if (out.length <= MAX_IMG_CHARS) return resolve(out);
        }
        scale *= 0.75;
      }
      resolve(null);
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
  const uploadImage = () => new Promise(resolve => {
    const file = el("input"); file.type = "file"; file.accept = "image/*";
    file.onchange = () => {
      const f = file.files && file.files[0];
      if (!f) return resolve(null);
      const reader = new FileReader();
      reader.onload = async () => {
        toast("Сжатие фото…");
        const data = await shrink(reader.result);
        if (!data) { toast("Не удалось прочитать фото.", true); return resolve(null); }
        const parts = [];
        for (let i = 0; i < data.length; i += PART) parts.push(data.slice(i, i + PART));
        if (!await ask("img_begin", { total: parts.length })) return resolve(null);
        let id = null;
        for (let i = 0; i < parts.length; i++) {
          toast(`Загрузка фото: ${i + 1} / ${parts.length}`);
          const r = await ask("img_part", { index: i + 1, data: parts[i] });
          if (!r) return resolve(null);
          if (r.id) id = r.id;
        }
        if (id) { imgCache.set(id, data); toast("Фото загружено."); }
        resolve(id);
      };
      reader.readAsDataURL(f);
    };
    file.click();

  // -- отрисовка сайта -----------------------------------------------------------------------
  const COLS = { "1": 1, "2": 2, "3": 3, "2-1": 2, "1-2": 2 };
  const LAYOUT_LABEL = { "1": "▮", "2": "▮▮", "3": "▮▮▮", "2-1": "▮▮▯", "1-2": "▯▮▮" };
  // Пустой список из Lua приходит объектом {} — приводим к массивам перед работой.
  const arr = v => Array.isArray(v) ? v : [];
  // Страница сайта приходит строкой JSON кусками (layoutParts) — глубокие таблицы платформа теряет.
  const layoutOf = s => {
    if (s && Array.isArray(s.layoutParts)) { try { return JSON.parse(s.layoutParts.join("")); } catch (e) { return { rows: [] }; } }
    return (s && s.layout) || { rows: [] };
  };
  const normLayout = layout => {
    const rows = arr(layout && layout.rows).map(row => {
      const n = COLS[row && row.layout] || 1;
      const cols = arr(row && row.cols).map(col => arr(col).map(b => (b && b.t === "list") ? { ...b, items: arr(b.items) } : b));
      while (cols.length < n) cols.push([]);
      cols.length = n;
      return { layout: COLS[row && row.layout] ? row.layout : "1", cols };
    });
    return { v: 2, rows };
  };

  // Один блок. ctx.ads — баннеры объявлений ({ [id]: banner }), ctx.preview — без переходов,
  // ctx.adInfo — у редактора: объявления сайта со статусом.
  const renderBlock = (b, ctx) => {
    if (b.t === "h") { const n = el("h3", "", b.text); if (b.align) n.style.textAlign = b.align; return n; }
    if (b.t === "p") { const n = el("p", "pre", b.text); if (b.align) n.style.textAlign = b.align; return n; }
    if (b.t === "quote") return el("blockquote", "pre", b.text);

    if (b.t === "price") { const r = el("div", "price"); r.append(el("span", "", b.name), el("b", "", money(b.price))); return r; }
    if (b.t === "list") { const ul = el("ul"); for (const i of b.items || []) ul.append(el("li", "", i)); return ul; }
    if (b.t === "divider") return el("hr", "divider");
    if (b.t === "adorder") {
      const n = el("div", "sitebtn adorder", b.text || "Заказать рекламу");
      if (!ctx.preview && ctx.onAdOrder) n.addEventListener("click", ctx.onAdOrder);
      return n;
    }
    if (b.t === "button") {
      const n = el("div", "sitebtn", b.text || "Кнопка");
      if (!ctx.preview && b.link) n.addEventListener("click", () => webApp(b.link));
      return n;
    }
    if (b.t === "image") {
      const fig = el("figure", "fig size-" + (b.size || "m") + " fit-" + (b.fit || "cover"));
      if (b.img) { const im = el("img"); setImg(im, b.img); fig.append(im); } else fig.append(el("div", "ph", "Фото не выбрано"));
      if (b.caption) fig.append(el("figcaption", "", b.caption));
      return fig;
    }
    if (b.t === "ad") {
      const banner = ctx.ads && ctx.ads[String(b.ad)];
      if (ctx.adInfo) {
        const info = ctx.adInfo.find(a => a.id === b.ad);
        const box = el("div", "adslot");
        if (info) box.append(renderBanner(info.banner, false));
        box.append(el("div", "adnote", !info ? "Объявление не выбрано"
          : info.status === "accepted" ? `Оплата ${money(info.price)} и срок ${info.days} дн. — при сохранении сайта`
          : info.live ? "Показывается до " + when(info.ends) : "Срок истёк — блок не виден посетителям"));
        return box;
      }
      return banner ? renderBanner(banner, !ctx.preview) : null;
    }
    return null;
  };

  const renderRows = (root, layout, ctx) => {
    for (const row of (layout && layout.rows) || []) {
      const r = el("div", "srow cols-" + row.layout);
      for (const col of row.cols || []) {
        const c = el("div", "scol");
        for (const b of col || []) { const n = renderBlock(b, ctx); if (n) c.append(n); }
        r.append(c);
      }
      root.append(r);
    }
  };

  const renderSite = (s, preview) => {
    const site = el("div", "site theme-" + (s.theme || "neon"));
    const hero = el("div", "hero" + (s.cover || s.coverImg ? " cover" : ""));
    if (s.cover || s.coverImg) {
      // Затемнение поверх картинки — заголовок читается на любой обложке.
      const paint = data => { hero.style.background = `linear-gradient(180deg, rgba(0,0,0,0.15), rgba(0,0,0,0.75)), url("${data}")`; };
      if (s.cover) paint(`covers/${s.cover}.svg`);
      else if (imgCache.has(s.coverImg)) paint(imgCache.get(s.coverImg)); else loadImage(s.coverImg).then(d => { if (d) paint(d); });
    }
    hero.append(el("h1", "", s.title));
    if (s.tagline) hero.append(el("p", "", s.tagline));
    else if (s.owner) hero.append(el("p", "", "Владелец: " + s.owner));
    site.append(hero);
    if (s.hidden) site.append(el("p", "", "Сайт скрыт модерацией — его видите только вы."));
    // Кнопка «Заказать рекламу» на сайте ведёт к редактору баннера (на своём сайте — подсказка).
    const onAdOrder = () => {
      if (s.mine) return toast("Это кнопка для посетителей: по ней они собирают баннер и отправляют заявку.");
      if (!(s.adPrice > 0)) return toast("Владелец сайта сейчас не продаёт рекламу.");
      adOrderPage(s);
    };
    renderRows(site, normLayout(s.layout || layoutOf(s)), { ads: (s.ads && !Array.isArray(s.ads)) ? s.ads : {}, preview, onAdOrder });
    if (s.shop) {
      site.append(el("h3", "", "Магазин"));
      if (!s.licensed) site.append(el("p", "", "Нужна лицензия на оружие — оформляется в «Городской службе»."));
      const grid = el("div", "shop");
      for (const g of s.shop) {
        const c = el("div", "good");
        const qty = el("input"); qty.type = "number"; qty.min = "1"; qty.max = "10"; qty.value = "1";
        const buy = btn("Заказать", "", async () => {
          buy.disabled = true;
          const r = await ask("shop_buy", { domain: s.domain, item: g.id, count: Number(qty.value) || 1 });
          buy.disabled = false;
          if (r) { toast(r.text); refreshHome(); }
        });
        buy.disabled = !s.licensed;
        const row = el("div", "flex");
        row.append(qty, buy);
        c.append(el("b", "", g.label), el("div", "p", money(g.price)), row);
        grid.append(c);
      }
      site.append(grid);
      site.append(el("p", "", "Оплата сразу со счёта. Заказ ждёт в любом почтомате города."));
    }
    if (!preview && s.mine) {
      const row = el("div", "flex"); row.style.marginTop = "20px";
      row.append(btn("Редактировать", "", () => { current = "build"; renderDock(); editor(s.domain); }));
      site.append(row);
    }
    return site;
  };

  // -- заявка на рекламу: редактор баннера --------------------------------------------------
  const SWATCHES = ["#12001f", "#04121c", "#0b1421", "#1a1406", "#2b0a0a", "#0d2b16", "#ffffff", "#d9dee2",
                    "#ff3d7f", "#5ef6ff", "#f3e600", "#78dc8c", "#ff7a00", "#b06cff", "#111111", "#f2eaff"];
  const colorField = (label, value, onPick) => {
    const wrap = el("div", "cfield");
    wrap.append(el("label", "f", label));
    const row = el("div", "swatches");
    const hex = el("input"); hex.value = value; hex.maxLength = 7; hex.className = "hex";
    const mark = () => row.querySelectorAll(".sw").forEach(x => x.classList.toggle("sel", x.dataset.c === hex.value.toLowerCase()));
    for (const c of SWATCHES) {
      const sw = el("span", "sw"); sw.style.background = c; sw.dataset.c = c;
      sw.addEventListener("click", () => { hex.value = c; mark(); onPick(c); });
      row.append(sw);
    }
    hex.addEventListener("input", () => { if (/^#[0-9a-fA-F]{6}$/.test(hex.value)) { mark(); onPick(hex.value.toLowerCase()); } });
    row.append(hex);
    wrap.append(row);
    mark();
    return wrap;
  };

  // Отдельная страница заказа рекламы (из кнопки на сайте); «Назад» — обратно на сайт.
  const adOrderPage = s => {
    const app = view("Реклама на " + s.domain, btn("← Назад на сайт", "ghost", () => webApp(s.domain)));
    const body = el("div", "body"); app.append(body);
    body.append(adRequestForm(s, () => webApp(s.domain)));
  };

  const adRequestForm = (s, done) => {
    const bn = { format: "wide", bg: "#12001f", bg2: "#04121c", fg: "#f2eaff", accent: "#ff3d7f", font: "sans",
                 title: "Ваш заголовок", text: "", cta: "Подробнее", link: "", img: null };
    const f = el("div", "card adform");
    f.append(el("b", "", "Реклама на этом сайте: " + money(s.adPrice) + " в день. Соберите баннер — владелец сайта разместит его у себя."));
    const grid = el("div", "adgrid");
    const left = el("div"); const right = el("div", "adpreview");
    grid.append(left, right); f.append(grid);
    const preview = () => { right.replaceChildren(el("div", "muted", "Предпросмотр"), renderBanner(bn, false)); };
    const fmt = el("div", "flex");
    const fWide = btn("Широкий", "sel", () => { bn.format = "wide"; fWide.classList.add("sel"); fSq.classList.remove("sel"); preview(); });
    const fSq = btn("Квадратный", "", () => { bn.format = "square"; fSq.classList.add("sel"); fWide.classList.remove("sel"); preview(); });
    fmt.append(fWide, fSq);
    const input = (label, key, max, area) => {
      const i = area ? el("textarea") : el("input"); i.maxLength = max; i.value = bn[key] || "";
      if (area) i.rows = 2;
      i.addEventListener("input", () => { bn[key] = i.value; preview(); });
      left.append(el("label", "f", label), i);
      return i;
    };
    left.append(el("label", "f", "Формат"), fmt);
    input("Заголовок", "title", 48);
    input("Текст", "text", 160, true);
    input("Кнопка (необязательно)", "cta", 24);
    const link = input("Ссылка на ваш сайт — имя.nc (необязательно)", "link", 40);
    link.placeholder = "можно оставить пустым";
    const font = el("select");
    for (const [k, v] of [["sans", "Обычный"], ["mono", "Терминал"], ["display", "Крупный"]]) { const o = el("option", "", v); o.value = k; font.append(o); }
    font.addEventListener("change", () => { bn.font = font.value; preview(); });
    left.append(el("label", "f", "Шрифт"), font);
    left.append(colorField("Фон (верх)", bn.bg, c => { bn.bg = c; preview(); }),
      colorField("Фон (низ)", bn.bg2, c => { bn.bg2 = c; preview(); }),
      colorField("Текст", bn.fg, c => { bn.fg = c; preview(); }),
      colorField("Кнопка", bn.accent, c => { bn.accent = c; preview(); }));
    const photoRow = el("div", "flex"); photoRow.style.marginTop = "10px";
    const noPhoto = btn("Убрать фото", "ghost", () => { bn.img = null; noPhoto.disabled = true; preview(); });
    noPhoto.disabled = true;
    photoRow.append(btn("Фото фона…", "", async () => { const id = await uploadImage(); if (id) { bn.img = id; noPhoto.disabled = false; preview(); } }), noPhoto);
    left.append(photoRow);
    const days = el("input"); days.type = "number"; days.min = "1"; days.max = "14"; days.value = "3";
    const total = el("span", "muted");
    const sum = () => { total.textContent = "Итого: " + money((Number(days.value) || 0) * s.adPrice) + " — спишется, когда владелец разместит баннер."; };
    days.addEventListener("input", sum); sum();
    left.append(el("label", "f", "Дней показа"), days, total);
    const send = btn("Отправить заявку владельцу", "pink", async () => {
      send.disabled = true;
      const r = await ask("ad_request", { domain: s.domain, days: Number(days.value) || 1, banner: JSON.stringify({ ...bn, link: (bn.link || "").trim() }) });
      send.disabled = false;
      if (r) { toast("Заявка отправлена. Оплата " + money(r.price) + " — когда владелец разместит баннер."); if (done) done(); }
    });
    const row = el("div", "flex"); row.style.marginTop = "12px"; row.append(send);
    left.append(row);
    preview();
    return f;
  };

  // -- конструктор сайтов --------------------------------------------------------------------
  // Выбор обложки: превью + «Загрузить» / «Убрать». get() — текущий номер фото, set(id|null).
  const coverPicker = (get, set) => {
    const box = el("div");
    const draw = () => {
      box.replaceChildren();
      const pv = el("div", "coverpick", get() ? "" : "Обложка не выбрана");
      if (get()) setImg(pv, get(), true);
      const row = el("div", "flex");
      row.append(btn(get() ? "Заменить…" : "Загрузить обложку…", "", async () => { const id = await uploadImage(); if (id) { set(id); draw(); } }));
      if (get()) row.append(btn("Убрать", "ghost", () => { set(null); draw(); }));
      box.append(pv, row);
    };
    draw();
    return box;
  };

  const buildApp = async () => {
    const app = view("Мои сайты");
    const body = el("div", "body"); app.append(body);
    const d = await ask("site_dir");
    if (!d) return;
    const mine = d.list.filter(s => s.mine);
    const c = el("div", "card");
    c.append(el("b", "", "Новый сайт — регистрация домена " + money(me.sitePrice)));
    const dom = el("input"); dom.placeholder = "имя (латиница, цифры, дефис) → имя.nc";
    const title = el("input"); title.placeholder = "Название сайта"; title.maxLength = 48;
    let cover = null;
    const pick = coverPicker(() => cover, id => { cover = id; });
    c.append(el("label", "f", "Домен"), dom, el("label", "f", "Название"), title,
      el("label", "f", "Обложка для каталога (необязательно, файл с ПК)"), pick);
    const row = el("div", "flex"); row.style.marginTop = "10px";
    row.append(btn("Зарегистрировать", "pink", async () => {
      const r = await ask("site_create", { domain: dom.value, title: title.value, cover: cover || 0 });
      if (r) { toast("Сайт " + r.domain + " зарегистрирован."); refreshHome(); editor(r.domain); }
    }));
    c.append(row);
    body.append(c);
    if (!mine.length) body.append(el("div", "empty", "У вас пока нет сайтов"));
    for (const s of mine) {
      const r = el("div", "card flex");
      let armed = false;
      const del = btn("Удалить", "ghost", async () => {
        if (!armed) { armed = true; del.textContent = "Точно удалить?"; del.className = "b pink"; return; }
        if (await ask("site_delete", { domain: s.domain })) { toast("Сайт " + s.domain + " удалён."); buildApp(); }
      });
      const lst = d.listing || {};
      const status = s.listed ? el("span", "listing on", "в каталоге до " + when(s.listedUntil))
        : el("span", "listing off", `не в каталоге — «Городская служба», ${money(lst.price || 0)} / ${lst.days || 30} дн., нужен SIN`);
      r.append(el("b", "", s.title), el("code", "muted", s.domain), status, el("span", "grow"),
        btn("Открыть", "ghost", () => { current = "web"; renderDock(); webApp(s.domain); }),
        btn("Редактировать", "", () => editor(s.domain)), del);
      body.append(r);
    }
  };

  const BLOCKS = [["h", "Заголовок"], ["p", "Текст"], ["image", "Фото"], ["button", "Кнопка"], ["price", "Цена"],
                  ["list", "Список"], ["contact", "Контакты"], ["quote", "Цитата"], ["divider", "Разделитель"], ["ad", "Реклама"],
                  ["adorder", "Заказ рекламы"]];
  const blockLabel = t => (BLOCKS.find(x => x[0] === t) || [, t])[1];
  const newBlock = t => t === "price" ? { t, name: "Товар", price: 100 } : t === "list" ? { t, items: ["Пункт"] }
    : t === "image" ? { t, img: null, size: "m", fit: "cover" } : t === "button" ? { t, text: "Перейти", link: "" }
    : t === "divider" ? { t } : t === "ad" ? { t, ad: null } : t === "adorder" ? { t, text: "Заказать рекламу" } : { t, text: t === "h" ? "Заголовок" : "Текст" };

  const editor = async domain => {
    const s = await ask("site_get", { domain });
    if (!s || !s.mine) return;
    s.available = arr(s.available);
    const layout = normLayout(layoutOf(s));
    if (!layout.rows.length) layout.rows.push({ layout: "1", cols: [[]] });
    let sel = null;        // { r, c, i } — выбранный блок
    let target = { r: 0, c: 0 };   // куда добавлять новый блок
    let drag = null;       // { r, c, i } или { t } для нового
    const iTitle = el("input"); iTitle.value = s.title; iTitle.maxLength = 48;
    const iTheme = el("select");
    for (const [k, v] of Object.entries(me.themes || {})) { const o = el("option", "", v); o.value = k; if (k === s.theme) o.selected = true; iTheme.append(o); }
    const iAd = el("input"); iAd.type = "number"; iAd.min = "0"; iAd.value = String(s.adPrice || 0);
    let cover = s.coverImg || null;
    const iCover = coverPicker(() => cover, id => { cover = id; });

    const save = btn("Сохранить", "pink", async () => {
      save.disabled = true;
      // Страница — строкой JSON: глубоко вложенные данные мост страницы → Lua молча теряет
      // (проверено владельцем 2026-11-05), строки проходят.
      const r = await askBig("site_save", { domain: s.domain, title: iTitle.value, theme: iTheme.value,
                                            layout: JSON.stringify(layout), adPrice: Number(iAd.value) || 0, cover: cover || 0 });
      save.disabled = false;
      if (r) { toast("Сайт сохранён."); s.available = arr(r.available); draw(); return; }
      // Ответ мог потеряться по дороге (2026-11-05): перечитать сайт и сравнить.
      const check = await api("site_get", { domain: s.domain });
      const sig = l => normLayout(l).rows.map(row => row.layout + ":" + row.cols.map(col => col.map(b => b.t).join(",")).join("|")).join("/");
      if (check.ok && check.data && sig(layoutOf(check.data)) === sig(layout)) {
        toast("Сайт сохранён (ответ сервера задержался).");
        s.available = arr(check.data.available);
      }
    });
    const app = view("Редактор: " + s.domain, el("span", "grow"), save,
      btn("Открыть в браузере", "ghost", () => { current = "web"; renderDock(); webApp(s.domain); }));
    const wrap = el("div", "editor");
    const side = el("div", "eside"); const canvasBox = el("div", "ecanvas");
    wrap.append(side, canvasBox); app.append(wrap);

    const at = p => layout.rows[p.r] && layout.rows[p.r].cols[p.c] && layout.rows[p.r].cols[p.c][p.i];
    const fitRow = row => {
      const n = COLS[row.layout] || 1;
      while (row.cols.length < n) row.cols.push([]);
      while (row.cols.length > n) { const extra = row.cols.pop(); row.cols[row.cols.length - 1].push(...extra); }
    };

    // -- боковая панель: сайт, палитра, свойства блока
    const drawSide = () => {
      side.replaceChildren();
      const site = el("div", "card");
      site.append(el("label", "f", "Название"), iTitle, el("label", "f", "Оформление"), iTheme,
        el("label", "f", "Реклама: цена за день (0 — не продавать)"), iAd,
        el("label", "f", "Обложка — в каталоге и шапке сайта"), iCover);
      side.append(site);
      const pal = el("div", "card");
      pal.append(el("label", "f", "Блоки — перетащите на страницу или нажмите"));
      const grid = el("div", "palette");
      for (const [t, label] of BLOCKS) {
        const b = el("div", "pitem", label);
        b.addEventListener("mousedown", e => startDrag(e, { t }, label));
        b.addEventListener("click", () => {
          if (dragged) return;
          const col = layout.rows[target.r] ? layout.rows[target.r].cols[target.c] : null;
          if (!col) return;
          col.push(newBlock(t));
          sel = { r: target.r, c: target.c, i: col.length - 1 };
          draw();
        });
        grid.append(b);
      }
      pal.append(grid);
      side.append(pal);
      side.append(drawProps());
    };

    const drawProps = () => {
      const box = el("div", "card");
      const b = sel && at(sel);
      if (!b) { box.append(el("div", "muted", "Выберите блок на странице, чтобы изменить его.")); return box; }
      box.append(el("label", "f", "Блок: " + blockLabel(b.t)));
      const text = (label, key, max, area) => {
        const i = area ? el("textarea") : el("input"); i.maxLength = max; i.value = b[key] || "";
        if (area) i.rows = 5;
        i.addEventListener("input", () => { b[key] = i.value; drawCanvas(); });
        box.append(el("label", "f", label), i);
      };
      const choice = (label, key, opts) => {
        const row = el("div", "flex");
        for (const [v, l] of opts) {
          const o = btn(l, (b[key] || opts[0][0]) === v ? "sel" : "ghost", () => { b[key] = v; drawCanvas(); box.replaceWith(drawProps()); });
          row.append(o);
        }
        box.append(el("label", "f", label), row);
      };
      if (b.t === "h") { text("Текст", "text", 80); choice("Выравнивание", "align", [["left", "Слева"], ["center", "По центру"], ["right", "Справа"]]); }
      else if (b.t === "p") { text("Текст", "text", 1200, true); choice("Выравнивание", "align", [["left", "Слева"], ["center", "По центру"], ["right", "Справа"]]); }
      else if (b.t === "quote") text("Цитата", "text", 600, true);
      else if (b.t === "contact") text("Контакты", "text", 400, true);
      else if (b.t === "price") {
        text("Название", "name", 80);
        const p = el("input"); p.type = "number"; p.min = "0"; p.value = String(b.price || 0);
        p.addEventListener("input", () => { b.price = Number(p.value) || 0; drawCanvas(); });
        box.append(el("label", "f", "Цена, €$"), p);
      } else if (b.t === "list") {
        const t = el("textarea"); t.rows = 5; t.value = (b.items || []).join("\n");
        t.addEventListener("input", () => { b.items = t.value.split("\n").map(x => x.trim()).filter(Boolean); drawCanvas(); });
        box.append(el("label", "f", "Пункты — по одному на строку"), t);
      } else if (b.t === "button") {
        text("Текст кнопки", "text", 24);
        text("Ссылка — адрес сайта (имя.nc)", "link", 40);
      } else if (b.t === "adorder") {
        text("Текст кнопки", "text", 32);
        box.append(el("div", "muted", "Посетитель нажимает кнопку, собирает баннер и отправляет заявку. Без этой кнопки сайт заявок не принимает. "
          + "Цена рекламы в день — в настройках сайта" + (Number(iAd.value) > 0 ? "." : " (сейчас 0 — заявки не принимаются).")));
      } else if (b.t === "image") {
        const row = el("div", "flex");
        row.append(btn(b.img ? "Заменить фото…" : "Загрузить фото…", "pink", async () => {
          const id = await uploadImage();
          if (id) { b.img = id; drawCanvas(); box.replaceWith(drawProps()); }
        }));
        box.append(el("label", "f", "Фото (файл с ПК, сжимается до ~55 КБ)"), row);
        text("Подпись (необязательно)", "caption", 120);
        choice("Высота", "size", [["s", "Низкое"], ["m", "Среднее"], ["l", "Высокое"]]);
        choice("Вписать", "fit", [["cover", "Заполнить"], ["contain", "Целиком"]]);
      } else if (b.t === "ad") {
        const list = s.available || [];
        if (!list.length) box.append(el("div", "muted", "Нет принятых заявок для " + s.domain + ". Заявка привязана к сайту, на который её подали: "
          + "смотрите колонку «Сайт» в приложении «Реклама». Пустой блок не сохранится — уберите его или примите заявку на этот сайт."));
        for (const a of list) {
          const used = layout.rows.some(r => r.cols.some(c => c.some(x => x !== b && x.t === "ad" && x.ad === a.id)));
          const o = el("div", "adpick" + (b.ad === a.id ? " sel" : "") + (used ? " used" : ""));
          o.append(el("b", "", a.title), el("div", "muted", a.status === "accepted"
            ? `${a.days} дн. за ${money(a.price)} — оплата при сохранении`
            : a.status === "paused" ? `не показывается — оплачено, осталось ${leftText(a.left)}; срок пойдёт после сохранения`
            : (a.live ? "показывается до " + when(a.ends) + " (уберёте блок — срок встанет на паузу)" : "срок истёк")));
          if (!used) o.addEventListener("click", () => { b.ad = a.id; drawCanvas(); box.replaceWith(drawProps()); });
          box.append(o);
        }
      }
      const ops = el("div", "flex"); ops.style.marginTop = "12px";
      ops.append(btn("Удалить блок", "ghost", () => {
        layout.rows[sel.r].cols[sel.c].splice(sel.i, 1); sel = null; draw();
      }));
      box.append(ops);
      return box;
    };

    // -- холст: строки, колонки, перетаскивание
    // Своё перетаскивание на событиях мыши: HTML5 drag-and-drop в игровом окне не работает
    // (проверено владельцем 2026-11-05). Зажать блок, сдвинуть на 6 px — тянется «призрак»,
    // розовая линия показывает место; отпустить — блок встаёт туда.
    let dragged = false;   // только что тащили — щелчок не считать выбором
    const clearLines = () => canvasBox.querySelectorAll(".dropline").forEach(x => x.remove());
    const spotAt = (x, y) => {
      const hit = document.elementFromPoint(x, y);
      const cell = hit && hit.closest && hit.closest(".ecol");
      if (!cell) return null;
      const kids = [...cell.querySelectorAll(":scope > .eblk")];
      let idx = kids.length;
      for (let k = 0; k < kids.length; k++) {
        const rect = kids[k].getBoundingClientRect();
        if (y < rect.top + rect.height / 2) { idx = k; break; }
      }
      return { cell, kids, idx, r: Number(cell.dataset.r), c: Number(cell.dataset.c) };
    };
    const startDrag = (e, info, label) => {
      if (e.button !== 0) return;
      e.preventDefault();   // без выделения текста при перетаскивании
      const x0 = e.clientX, y0 = e.clientY;
      let ghost = null, spot = null, scroll = 0, timer = null;
      const move = ev => {
        if (!ghost) {
          if (Math.abs(ev.clientX - x0) + Math.abs(ev.clientY - y0) < 6) return;
          ghost = el("div", "dragghost", label);
          document.body.append(ghost);
          drag = info;
          timer = setInterval(() => { if (scroll) canvasBox.scrollTop += scroll; }, 16);
        }
        ev.preventDefault();
        ghost.style.left = ev.clientX + 12 + "px"; ghost.style.top = ev.clientY + 8 + "px";
        const box = canvasBox.getBoundingClientRect();
        scroll = ev.clientY < box.top + 50 ? -12 : ev.clientY > box.bottom - 50 ? 12 : 0;
        clearLines();
        spot = spotAt(ev.clientX, ev.clientY);
        if (spot) {
          const line = el("div", "dropline");
          if (spot.idx < spot.kids.length) spot.cell.insertBefore(line, spot.kids[spot.idx]); else spot.cell.append(line);
        }
      };
      const up = () => {
        window.removeEventListener("mousemove", move, true);
        window.removeEventListener("mouseup", up, true);
        if (!ghost) return;
        clearInterval(timer);
        ghost.remove();
        clearLines();
        dragged = true; setTimeout(() => { dragged = false; }, 0);
        if (spot) dropAt(spot.r, spot.c, spot.idx); else drag = null;
      };
      window.addEventListener("mousemove", move, true);
      window.addEventListener("mouseup", up, true);
    };

    const dropAt = (r, c, i) => {
      const col = layout.rows[r].cols[c];
      if (drag && drag.t) {
        col.splice(i, 0, newBlock(drag.t));
        sel = { r, c, i };
      } else if (drag) {
        const from = layout.rows[drag.r].cols[drag.c];
        const [moved] = from.splice(drag.i, 1);
        if (from === col && drag.i < i) i--;
        col.splice(i, 0, moved);
        sel = { r, c, i };
      }
      drag = null;
      draw();
    };

    const drawCanvas = () => {
      canvasBox.replaceChildren();
      const page = el("div", "site edit theme-" + (iTheme.value || "neon"));
      const hero = el("div", "hero"); hero.append(el("h1", "", iTitle.value || s.title));
      page.append(hero);
      layout.rows.forEach((row, r) => {
        const rowBox = el("div", "erow");
        const bar = el("div", "ebar");
        for (const k of Object.keys(COLS)) {
          bar.append(btn(LAYOUT_LABEL[k], row.layout === k ? "sel" : "ghost", () => { row.layout = k; fitRow(row); if (sel && sel.r === r && sel.c >= row.cols.length) sel = null; draw(); }));
        }
        bar.append(el("span", "grow"),
          btn("↑", "ghost", () => { if (r > 0) { [layout.rows[r - 1], layout.rows[r]] = [layout.rows[r], layout.rows[r - 1]]; sel = null; draw(); } }),
          btn("↓", "ghost", () => { if (r < layout.rows.length - 1) { [layout.rows[r + 1], layout.rows[r]] = [layout.rows[r], layout.rows[r + 1]]; sel = null; draw(); } }),
          btn("Удалить строку", "ghost", () => { layout.rows.splice(r, 1); if (!layout.rows.length) layout.rows.push({ layout: "1", cols: [[]] }); sel = null; target = { r: 0, c: 0 }; draw(); }));
        rowBox.append(bar);
        const grid = el("div", "srow cols-" + row.layout);
        row.cols.forEach((col, c) => {
          const cell = el("div", "scol ecol" + (target.r === r && target.c === c ? " target" : ""));
          cell.dataset.r = r; cell.dataset.c = c;
          cell.addEventListener("click", e => { if (!dragged && (e.target === cell || e.target.classList.contains("ehint"))) { target = { r, c }; drawCanvas(); } });
          col.forEach((b, i) => {
            const wrapB = el("div", "eblk" + (sel && sel.r === r && sel.c === c && sel.i === i ? " sel" : ""));
            wrapB.append(el("div", "etag", blockLabel(b.t)));
            const inner = renderBlock(b, { preview: true, adInfo: s.available || [] }) || el("div", "muted", "Реклама: выберите объявление");
            wrapB.append(inner);
            wrapB.addEventListener("click", e => { e.stopPropagation(); if (dragged) return; sel = { r, c, i }; target = { r, c }; draw(); });
            wrapB.addEventListener("mousedown", e => { startDrag(e, { r, c, i }, blockLabel(b.t)); });
            cell.append(wrapB);
          });
          if (!col.length) cell.append(el("div", "ehint", "Перетащите блок сюда"));
          grid.append(cell);
        });
        rowBox.append(grid);
        page.append(rowBox);
      });
      const add = el("div", "flex"); add.style.marginTop = "14px";
      add.append(btn("+ Строка", "", () => { layout.rows.push({ layout: "1", cols: [[]] }); target = { r: layout.rows.length - 1, c: 0 }; draw(); }));
      page.append(add);
      canvasBox.append(page);
    };

    const draw = () => { drawSide(); drawCanvas(); };
    iTitle.addEventListener("input", drawCanvas);
    iTheme.addEventListener("change", drawCanvas);
    draw();
  };

  // -- реклама -------------------------------------------------------------------------------
  const STATUS = { pending: "на рассмотрении", accepted: "принята — ждёт размещения", paying: "оплата…", active: "показывается",
    paused: "Не показывается, разместите её на сайте", rejected: "отклонена", cancelled: "отозвана" };
  // Остаток оплаченного срока на паузе (секунды) → «2 дн. 5 ч».
  const leftText = sec => {
    const n = Math.max(0, Number(sec) || 0), d = Math.floor(n / 86400), h = Math.floor(n % 86400 / 3600), m = Math.floor(n % 3600 / 60);
    return d ? `${d} дн. ${h} ч` : h ? `${h} ч ${m} мин` : `${m} мин`;
  };
  const statusText = (a, now) => (a.status === "active" && a.ends && a.ends < now) ? "закончилась"
    : (STATUS[a.status] || a.status) + (a.status === "active" && a.ends ? " до " + when(a.ends) : "")
    + (a.status === "paused" ? ` (осталось ${leftText(a.left)}, срок стоит — оплата не идёт)` : "");
  const adsApp = async () => {
    const app = view("Реклама");
    const body = el("div", "body"); app.append(body);
    const d = await ask("ads");
    if (!d) return;
    const now = Date.now() / 1000;
    const status = a => statusText(a, now);
    body.append(el("h3", "", "Заявки на мои сайты"));
    if (!d.incoming.length) body.append(el("div", "muted", "Заявок нет. Цену рекламы задаёт «Мои сайты» → «Редактировать»."));
    else {
      const t = el("table", "t");
      const head = el("tr"); for (const h of ["Сайт", "Баннер", "От кого", "Срок", "Сумма", "Статус", ""]) head.append(el("th", "", h));
      t.append(head);
      for (const a of d.incoming) {
        const tr = el("tr");
        const ad = el("td", "adcell"); ad.append(renderBanner(a.banner || { title: a.title }, false));
        const acts = el("td");
        if (a.status === "accepted") acts.append(el("div", "muted", "Поставьте блок «Реклама» в редакторе сайта и сохраните — тогда спишется оплата и пойдёт срок."));
        if (a.status === "paused") acts.append(el("div", "muted", "Блок убран с сайта. Поставьте блок «Реклама» с этим объявлением и сохраните — срок пойдёт дальше без новой оплаты."));
        if (a.status === "pending") acts.append(btn("Принять", "", async () => { if (await ask("ad_decide", { id: a.id, accept: true })) { toast("Заявка принята. Разместите баннер блоком «Реклама» в редакторе сайта."); adsApp(); } }),
          btn("Отклонить", "ghost", async () => { if (await ask("ad_decide", { id: a.id, accept: false })) adsApp(); }));
        tr.append(el("td", "", a.domain), ad, el("td", "", a.from || ""), el("td", "", a.days + " дн."), el("td", "", money(a.price)),
          el("td", "st-" + a.status, status(a)), acts);
        t.append(tr);
      }
      body.append(t);
    }
    body.append(el("h3", "", "Мои объявления"));
    if (!d.mine.length) body.append(el("div", "muted", "Объявлений нет. Разместить — на странице чужого сайта в браузере."));
    else {
      const t = el("table", "t");
      const head = el("tr"); for (const h of ["Сайт", "Баннер", "Срок", "Сумма", "Статус", ""]) head.append(el("th", "", h));
      t.append(head);
      for (const a of d.mine) {
        const tr = el("tr");
        const acts = el("td");
        if (a.status === "pending" || a.status === "accepted") acts.append(btn("Отозвать", "ghost", async () => { if (await ask("ad_cancel", { id: a.id })) adsApp(); }));
        const ad = el("td", "adcell"); ad.append(renderBanner(a.banner || { title: a.title }, false));
        tr.append(el("td", "", a.domain), ad, el("td", "", a.days + " дн."), el("td", "", money(a.price)),
          el("td", "st-" + a.status, status(a)), acts);
        t.append(tr);
      }
      body.append(t);
    }
  };

  // -- заказы --------------------------------------------------------------------------------
  const ordersApp = async () => {
    const app = view("Заказы");
    const body = el("div", "body"); app.append(body);
    body.append(el("p", "muted", "Оплаченные заказы ждут в любом почтомате города: подойдите и нажмите E — «Pick up orders»."));
    const d = await ask("orders");
    if (!d) return;
    if (!d.list.length) { body.append(el("div", "empty", "Ожидающих заказов нет")); return; }
    const t = el("table", "t");
    const head = el("tr"); for (const h of ["№", "Товар", "Кол-во", "Сумма", "Магазин", "Дата"]) head.append(el("th", "", h));
    t.append(head);
    for (const o of d.list) {
      const tr = el("tr");
      tr.append(el("td", "", o.id), el("td", "", o.label), el("td", "", o.count), el("td", "", money(o.price)), el("td", "", o.site), el("td", "", when(o.at)));
      t.append(tr);
    }
    body.append(t);
  };

  const APPS_IMPL = { mail: () => mailApp(), msg: () => msgApp(), nc: () => ncApp(), web: () => webApp(), build: buildApp, ads: adsApp, orders: ordersApp };

  // -- жизненный цикл ------------------------------------------------------------------------
  $("quit").addEventListener("click", () => Open77.emit("net:close", {}));
  document.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); Open77.emit("net:close", {}); } });
  Open77.on("net:show", async () => {
    $("root").classList.add("open");
    await refreshHome();
    open(current);
  });
  Open77.on("net:hide", () => { $("root").classList.remove("open"); });
  Open77.ready();
})();
</script>
</body>
</html>
