<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>NCPD</title>
<style>
  :root { --bg: rgba(10, 12, 18, 0.95); --accent: #5aa0ff; --text: #e8f1f2; --muted: #8fa3a8; --warn: #ff5e6c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
    font: 15px/1.35 "Segoe UI", Arial, sans-serif; user-select: none; }
  #search { display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.35); }
  #search.open { display: block; }
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 620px; max-height: 78vh;
    overflow-y: auto; padding: 22px 24px; background: var(--bg); border: 1px solid rgba(90, 160, 255, 0.35);
    border-top: 3px solid var(--accent); }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; margin-bottom: 6px;
    border: 1px solid rgba(255, 255, 255, 0.08); }
  .row .name { flex: 1; }
  .row .name small { display: block; color: var(--muted); font-size: 12px; }
  .row input { width: 64px; padding: 5px 6px; background: rgba(255, 255, 255, 0.05); color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.15); font: inherit; user-select: text; }
  button { padding: 6px 12px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  button:hover { background: rgba(90, 160, 255, 0.12); }
  .empty { color: var(--muted); }
  .hint { margin-top: 12px; color: var(--muted); font-size: 12px; }
  #jail { display: none; position: absolute; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 22px;
    background: rgba(10, 12, 18, 0.82); border: 1px solid rgba(90, 160, 255, 0.35); border-top: 3px solid var(--accent);
    text-align: center; pointer-events: none; }
  #jail.open { display: block; }
  #jail b { font-size: 22px; color: var(--accent); letter-spacing: 2px; }
  #jail small { display: block; color: var(--muted); }
</style>
</head>
<body>
<div id="jail"><small>КПЗ</small><b id="jailLeft"></b><small id="jailReason"></small></div>
<div id="search">
  <div id="panel">
    <h1>Обыск</h1>
    <div class="sub" id="who"></div>
    <div id="list"></div>
    <div class="hint">Изъятое попадает к вам в инвентарь. Esc — закрыть.</div>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
  let jailLeft = 0, jailAt = 0, jailTimer = null;

  function renderSearch(p) {
    $("who").textContent = `${p.name} [${p.target}]`;
    const list = p.items || [];
    $("list").replaceChildren();
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Карманы пусты.";
      $("list").append(empty);
      return;
    }
    for (const it of list) {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<div class="name"><span></span><small></small></div><input type="number" min="1"><button>Изъять</button>`;
      row.querySelector(".name span").textContent = it.label;
      const extra = [`×${it.count}`];
      if (it.plate) extra.push(`номер ${it.plate}`);
      if (it.amount) extra.push(`${it.amount} €$`);
      row.querySelector("small").textContent = extra.join(" · ");
      const input = row.querySelector("input");
      input.value = it.count;
      input.max = it.count;
      if (it.count === 1) input.style.visibility = "hidden";
      row.querySelector("button").addEventListener("click", () => {
        const count = Math.max(1, Math.min(it.count, parseInt(input.value, 10) || 1));
        Open77.emit("pol:seize", { target: p.target, index: it.index, item: it.item, count });
      });
      $("list").append(row);
    }
  }

  function renderJail() {
    const left = Math.max(0, jailLeft - (Date.now() - jailAt) / 1000);
    $("jailLeft").textContent = mmss(left);
    if (left <= 0 && jailTimer) { clearInterval(jailTimer); jailTimer = null; }
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("search").classList.contains("open")) { e.preventDefault(); Open77.emit("pol:close", {}); }
  });

  Open77.on("pol:search", p => { renderSearch(p); $("search").classList.add("open"); });
  Open77.on("pol:closeSearch", () => $("search").classList.remove("open"));
  Open77.on("pol:jail", p => {
    jailLeft = Number(p.left) || 0;
    jailAt = Date.now();
    $("jailReason").textContent = p.reason || "";
    $("jail").classList.toggle("open", jailLeft > 0);
    if (jailLeft > 0) {
      renderJail();
      if (!jailTimer) jailTimer = setInterval(renderJail, 500);
    }
  });

  Open77.ready();
</script>
</body>
</html>
