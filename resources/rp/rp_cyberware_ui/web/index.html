<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рипердок</title>
<style>
  :root { --bg: rgba(10, 12, 18, 0.95); --accent: #c878ff; --cyan: #5ef6ff; --money: #f3e600; --ok: #78dc8c;
    --warn: #ff5e6c; --text: #e8f1f2; --muted: #8fa3a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
    font: 15px/1.35 "Segoe UI", Arial, sans-serif; user-select: none; }
  #root { display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); }
  #root.open { display: block; }
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 820px; max-height: 84vh;
    overflow-y: auto; padding: 22px 26px; background: var(--bg); border: 1px solid rgba(200, 120, 255, 0.35);
    border-top: 3px solid var(--accent); }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  h2 { margin: 18px 0 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.08); position: relative; margin-top: 6px; }
  .bar .fill { height: 100%; background: var(--cyan); }
  .bar .mark { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--warn); }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin-bottom: 6px; border: 1px solid rgba(255, 255, 255, 0.08); }
  .row .name { flex: 1; }
  .row .name small { display: block; color: var(--muted); font-size: 12px; }
  .row .cost { color: var(--warn); font-size: 13px; min-width: 90px; text-align: right; }
  .row .price { color: var(--money); font-weight: 600; min-width: 90px; text-align: right; }
  button { padding: 7px 14px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  button:hover { background: rgba(200, 120, 255, 0.12); }
  button:disabled { opacity: 0.35; cursor: default; }
  .empty { color: var(--muted); }
  #message { min-height: 22px; margin-top: 12px; font-size: 14px; }
  #message.ok { color: var(--ok); } #message.bad { color: var(--warn); }
  .hint { margin-top: 8px; color: var(--muted); font-size: 12px; }

  /* -- сканер Kiroshi -- */
  #scan { display: none; position: absolute; inset: 0; pointer-events: none; --k: #f3e600; --q: #5ef6ff; }
  #scan.open { display: block; }
  #scan .tint { position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(243, 230, 0, 0.02) 30%, rgba(30, 24, 0, 0.55) 100%),
      repeating-linear-gradient(0deg, rgba(243, 230, 0, 0.035) 0 1px, transparent 1px 4px); }
  #scan .sweep { position: absolute; left: 0; right: 0; height: 120px; top: -120px;
    background: linear-gradient(transparent, rgba(243, 230, 0, 0.07), transparent); animation: sweep 3.2s linear infinite; }
  @keyframes sweep { to { top: 100%; } }
  #scan .brand { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); color: var(--k);
    font-size: 13px; letter-spacing: 6px; text-transform: uppercase; opacity: 0.85; }
  #scan .brand b { color: #fff; font-weight: 400; }
  #reticle { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); transition: all 0.15s; }
  #reticle i { position: absolute; width: 22px; height: 22px; border: 2px solid var(--k); }
  #reticle i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #reticle i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #reticle i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #reticle i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  #reticle.lock { width: 90px; height: 90px; }
  #reticle.lock i { border-color: var(--warn); }
  #reticle .dot { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: var(--k); }
  #scanSide { position: absolute; left: calc(50% + 110px); top: calc(50% - 170px); width: 360px; }
  .card { background: rgba(12, 10, 2, 0.82); border: 1px solid rgba(243, 230, 0, 0.45); border-left: 4px solid var(--k);
    padding: 10px 14px; margin-bottom: 10px; }
  .card .cap { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--k); }
  .card .big { font-size: 22px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin: 2px 0 6px; }
  .card .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 2px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
  .card .kv span:first-child { color: var(--muted); }
  .card .bad { color: var(--warn); } .card .good { color: var(--ok); }
  .card.none { color: var(--muted); font-size: 13px; border-left-color: rgba(243, 230, 0, 0.4); }
  .qh { border-left-color: var(--q); border-color: rgba(94, 246, 255, 0.45); }
  .qh .cap { color: var(--q); display: flex; justify-content: space-between; }
  #ram { display: flex; gap: 3px; margin: 8px 0 8px; }
  #ram i { flex: 1; height: 10px; border: 1px solid rgba(94, 246, 255, 0.6); }
  #ram i.full { background: var(--q); }
  #ram i.part { background: linear-gradient(90deg, rgba(94, 246, 255, 0.55) var(--p), transparent var(--p)); }
  #ram i.cost { box-shadow: inset 0 0 0 2px #fff; }
  .script { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; font-size: 14px;
    border: 1px solid transparent; }
  .script .r { font-weight: 700; color: var(--q); }
  .script.sel { background: rgba(94, 246, 255, 0.16); border-color: var(--q); }
  .script.sel::before { content: "▶"; color: var(--q); margin-right: 6px; font-size: 10px; }
  .script.poor { opacity: 0.4; }
  .script .n { flex: 1; }
  #scriptDesc { font-size: 12px; color: var(--muted); min-height: 16px; margin-top: 6px; }
  #scanStatus { font-size: 12px; margin-top: 6px; color: var(--q); }
  #scanStatus.wait { color: var(--k); }
  #scanToast { position: absolute; left: 50%; top: calc(50% + 90px); transform: translateX(-50%); padding: 6px 14px;
    background: rgba(12, 10, 2, 0.85); border: 1px solid var(--warn); color: var(--warn); font-size: 14px; display: none; }
  #scanToast.show { display: block; }
  #scanHelp { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--k);
    letter-spacing: 1px; opacity: 0.8; }
</style>
</head>
<body>
<div id="root">
  <div id="panel">
    <h1 id="title"></h1>
    <div><span id="humText"></span><div class="bar"><div class="fill" id="humFill"></div><div class="mark" id="humMark"></div></div></div>
    <div class="hint">Красная отметка — порог: ниже него начинается психоз.</div>
    <h2>Установлено</h2>
    <div id="installed"></div>
    <h2>Импланты в карманах</h2>
    <div id="available"></div>
    <div id="message"></div>
    <div class="hint">Импланты покупают в магазине имплантов. Esc — закрыть.</div>
  </div>
</div>
<div id="scan">
  <div class="tint"></div><div class="sweep"></div>
  <div class="brand">Kiroshi <b>// сканирование</b></div>
  <div id="reticle"><i></i><i></i><i></i><i></i><div class="dot"></div></div>
  <div id="scanSide">
    <div class="card none" id="targetCard">Наведите взгляд на человека.</div>
    <div class="card qh" id="qhCard">
      <div class="cap"><span>Скрипты</span><span id="ramText"></span></div>
      <div id="ram"></div>
      <div id="scripts"></div>
      <div id="scriptDesc"></div>
      <div id="scanStatus"></div>
    </div>
  </div>
  <div id="scanToast"></div>
  <div id="scanHelp">Колесо — выбор скрипта · ЛКМ — отправить · отпустите TAB — выход</div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const money = n => `${String(Math.trunc(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ")} €$`;
  let busy = false;

  function message(text, ok) { $("message").textContent = text || ""; $("message").className = text ? (ok ? "ok" : "bad") : ""; }

  function row(parent, name, sub, right, rightClass, label, action, disabled) {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<div class="name"><span></span><small></small></div><div></div><button></button>`;
    el.querySelector(".name span").textContent = name;
    el.querySelector("small").textContent = sub || "";
    const r = el.children[1];
    r.className = rightClass;
    r.textContent = right || "";
    const b = el.querySelector("button");
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener("click", () => { if (busy) return; busy = true; document.querySelectorAll("button").forEach(x => x.disabled = true); action(); });
    parent.append(el);
  }

  function render(p) {
    $("title").textContent = p.title || "Рипердок";
    const max = p.humanityMax || 100;
    $("humText").textContent = `Человечность: ${p.humanity} / ${max}`;
    $("humFill").style.width = `${Math.max(0, p.humanity) / max * 100}%`;
    $("humMark").style.left = `${p.threshold / max * 100}%`;
    $("installed").replaceChildren();
    $("available").replaceChildren();
    const installed = Array.isArray(p.installed) ? p.installed : [];
    const available = Array.isArray(p.available) ? p.available : [];
    if (!installed.length) $("installed").innerHTML = `<div class="empty">Имплантов нет.</div>`;
    for (const it of installed) {
      row($("installed"), it.label, it.slotLabel, money(it.price), "price", "Снять", () => Open77.emit("cyb:remove", { slot: it.slot }));
    }
    if (!available.length) $("available").innerHTML = `<div class="empty">В карманах нет имплантов.</div>`;
    for (const it of available) {
      row($("available"), it.label, `${it.slotLabel} · ${it.description}${it.busy ? " · слот занят" : ""}`,
        `−${it.humanity} чел.`, "cost", `Поставить · ${money(it.price)}`,
        () => Open77.emit("cyb:install", { id: it.id }), it.busy || p.humanity - it.humanity < 0);
    }
    busy = false;
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("root").classList.contains("open")) { e.preventDefault(); Open77.emit("cyb:close", {}); }
  });

  Open77.on("cyb:clinic", p => { render(p); $("root").classList.add("open"); });
  Open77.on("cyb:result", p => message(p.text, p.ok));
  Open77.on("cyb:close", () => { $("root").classList.remove("open"); message(""); });

  // -- сканер Kiroshi --------------------------------------------------------------------
  let scanState = null, scanInfo = null, scanTarget = null, toastTimer = null;

  function toast(text) {
    $("scanToast").textContent = text;
    $("scanToast").classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $("scanToast").classList.remove("show"), 2500);
  }

  function kv(parent, key, value, cls) {
    const row = document.createElement("div");
    row.className = "kv";
    row.innerHTML = "<span></span><span></span>";
    row.children[0].textContent = key;
    row.children[1].textContent = value;
    if (cls) row.children[1].className = cls;
    parent.append(row);
  }

  function renderTarget(distance) {
    const card = $("targetCard");
    $("reticle").classList.toggle("lock", !!scanTarget);
    if (!scanTarget) {
      card.className = "card none";
      card.textContent = "Наведите взгляд на человека.";
      return;
    }
    card.className = "card";
    card.replaceChildren();
    card.innerHTML = `<div class="cap">Цель</div><div class="big"></div>`;
    card.querySelector(".big").textContent = `Объект #${scanTarget}`;
    kv(card, "Дистанция", distance ? `${distance} м` : "—");
    const i = scanInfo && scanInfo.target === scanTarget ? scanInfo : null;
    if (!i) { kv(card, "Анализ", "…"); return; }
    kv(card, "Киберимпланты", String(i.implants));
    kv(card, "Self-ICE", i.ice ? "обнаружен" : "нет", i.ice ? "bad" : "good");
    kv(card, "Кибердека", i.deck ? "есть" : "нет", i.deck ? "bad" : "");
    kv(card, "Purge", i.purge ? "есть" : "нет");
    kv(card, "Нейросостояние", i.unstable ? "нестабильно" : "стабильно", i.unstable ? "bad" : "good");
    if (i.downed) kv(card, "Состояние", "без сознания", "bad");
  }

  function renderScripts() {
    const p = scanState;
    if (!p) return;
    const card = $("qhCard");
    if (!p.deck) {
      card.style.display = "none";
      $("scanHelp").textContent = "Кибердеки нет — только сканирование · отпустите TAB — выход";
      return;
    }
    card.style.display = "";
    $("scanHelp").textContent = "Колесо — выбор скрипта · ЛКМ — отправить · отпустите TAB — выход";
    const scripts = Array.isArray(p.scripts) ? p.scripts : [];
    const sel = scripts[(p.selected || 1) - 1];
    $("ramText").textContent = `RAM ${Math.floor(p.ram)} / ${p.ramMax}`;
    const ram = $("ram");
    ram.replaceChildren();
    for (let n = 0; n < p.ramMax; n++) {
      const cell = document.createElement("i");
      if (p.ram >= n + 1) cell.className = "full";
      else if (p.ram > n) { cell.className = "part"; cell.style.setProperty("--p", `${(p.ram - n) * 100}%`); }
      // Клетки, которые съест выбранный скрипт.
      if (sel && n >= Math.floor(p.ram) - sel.ram && n < Math.floor(p.ram)) cell.classList.add("cost");
      ram.append(cell);
    }
    const list = $("scripts");
    list.replaceChildren();
    if (!scripts.length) list.innerHTML = `<div class="script poor"><span class="n">Дека пуста — вставьте скрипты в инвентаре (I → Импланты)</span></div>`;
    scripts.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "script" + (i === (p.selected || 1) - 1 ? " sel" : "") + (s.ram > p.ram ? " poor" : "");
      row.innerHTML = `<span class="n"></span><span class="r"></span>`;
      row.querySelector(".n").textContent = s.label;
      row.querySelector(".r").textContent = s.ram;
      list.append(row);
    });
    $("scriptDesc").textContent = sel ? `${sel.description} · до ${sel.range} м` : "";
    const status = $("scanStatus");
    if (p.busy) { status.textContent = "Идёт загрузка…"; status.className = "wait"; }
    else if (sel && !p.armed) { status.textContent = "Скрипт загружается в деку…"; status.className = "wait"; }
    else if (sel) { status.textContent = "Готов: ЛКМ — отправить"; status.className = ""; }
    else status.textContent = "";
  }

  Open77.on("scan:show", () => { scanTarget = null; scanInfo = null; renderTarget(); $("scan").classList.add("open"); });
  Open77.on("scan:hide", () => $("scan").classList.remove("open"));
  Open77.on("scan:state", p => { scanState = p; renderScripts(); if (p.text) toast(p.text); });
  Open77.on("scan:info", p => { scanInfo = p; renderTarget(p.distance); });
  Open77.on("scan:target", p => {
    const target = p.target || null;
    if (target !== scanTarget) { scanTarget = target; scanInfo = null; }
    renderTarget(p.distance);
  });
  Open77.on("scan:toast", p => toast(p.text));

  Open77.ready();
</script>
</body>
</html>
