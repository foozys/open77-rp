<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Рипердок</title>
<style>
  :root { --bg: rgba(10, 12, 18, 0.95); --accent: #c878ff; --cyan: #5ef6ff; --money: #f3e600; --ok: #78dc8c;
    --warn: #ff5e6c; --text: #e8f1f2; --muted: #8fa3a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
    font: 15px/1.35 "Segoe UI", Arial, sans-serif; user-select: none; }
  #root { display: none; position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); }
  #root.open { display: block; }
  #panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 820px; max-height: 84vh;
    overflow-y: auto; padding: 22px 26px; background: var(--bg); border: 1px solid rgba(200, 120, 255, 0.35);
    border-top: 3px solid var(--accent); }
  h1 { margin: 0 0 12px; font-size: 22px; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
  h2 { margin: 18px 0 8px; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .bar { height: 8px; background: rgba(255, 255, 255, 0.08); position: relative; margin-top: 6px; }
  .bar .fill { height: 100%; background: var(--cyan); }
  .bar .mark { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--warn); }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin-bottom: 6px; border: 1px solid rgba(255, 255, 255, 0.08); }
  .row .name { flex: 1; }
  .row .name small { display: block; color: var(--muted); font-size: 12px; }
  .row .cost { color: var(--warn); font-size: 13px; min-width: 90px; text-align: right; }
  .row .price { color: var(--money); font-weight: 600; min-width: 90px; text-align: right; }
  button { padding: 7px 14px; border: 1px solid var(--accent); background: transparent; color: var(--accent);
    font: inherit; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
  button:hover { background: rgba(200, 120, 255, 0.12); }
  button:disabled { opacity: 0.35; cursor: default; }
  .empty { color: var(--muted); }
  #message { min-height: 22px; margin-top: 12px; font-size: 14px; }
  #message.ok { color: var(--ok); } #message.bad { color: var(--warn); }
  .hint { margin-top: 8px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div id="root">
  <div id="panel">
    <h1 id="title"></h1>
    <div><span id="humText"></span><div class="bar"><div class="fill" id="humFill"></div><div class="mark" id="humMark"></div></div></div>
    <div class="hint">Красная отметка — порог: ниже него начинается психоз.</div>
    <h2>Установлено</h2>
    <div id="installed"></div>
    <h2>Импланты в карманах</h2>
    <div id="available"></div>
    <div id="message"></div>
    <div class="hint">Импланты покупают в магазине имплантов. Esc — закрыть.</div>
  </div>
</div>
<script>
  const $ = id => document.getElementById(id);
  const money = n => `${String(Math.trunc(n)).replace(/\B(?=(\d{3})+(?!\d))/g, " ")} €$`;
  let busy = false;

  function message(text, ok) { $("message").textContent = text || ""; $("message").className = text ? (ok ? "ok" : "bad") : ""; }

  function row(parent, name, sub, right, rightClass, label, action, disabled) {
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML = `<div class="name"><span></span><small></small></div><div></div><button></button>`;
    el.querySelector(".name span").textContent = name;
    el.querySelector("small").textContent = sub || "";
    const r = el.children[1];
    r.className = rightClass;
    r.textContent = right || "";
    const b = el.querySelector("button");
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener("click", () => { if (busy) return; busy = true; document.querySelectorAll("button").forEach(x => x.disabled = true); action(); });
    parent.append(el);
  }

  function render(p) {
    $("title").textContent = p.title || "Рипердок";
    const max = p.humanityMax || 100;
    $("humText").textContent = `Человечность: ${p.humanity} / ${max}`;
    $("humFill").style.width = `${Math.max(0, p.humanity) / max * 100}%`;
    $("humMark").style.left = `${p.threshold / max * 100}%`;
    $("installed").replaceChildren();
    $("available").replaceChildren();
    const installed = Array.isArray(p.installed) ? p.installed : [];
    const available = Array.isArray(p.available) ? p.available : [];
    if (!installed.length) $("installed").innerHTML = `<div class="empty">Имплантов нет.</div>`;
    for (const it of installed) {
      row($("installed"), it.label, it.slotLabel, money(it.price), "price", "Снять", () => Open77.emit("cyb:remove", { slot: it.slot }));
    }
    if (!available.length) $("available").innerHTML = `<div class="empty">В карманах нет имплантов.</div>`;
    for (const it of available) {
      row($("available"), it.label, `${it.slotLabel} · ${it.description}${it.busy ? " · слот занят" : ""}`,
        `−${it.humanity} чел.`, "cost", `Поставить · ${money(it.price)}`,
        () => Open77.emit("cyb:install", { id: it.id }), it.busy || p.humanity - it.humanity < 0);
    }
    busy = false;
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("root").classList.contains("open")) { e.preventDefault(); Open77.emit("cyb:close", {}); }
  });

  Open77.on("cyb:clinic", p => { render(p); $("root").classList.add("open"); });
  Open77.on("cyb:result", p => message(p.text, p.ok));
  Open77.on("cyb:close", () => { $("root").classList.remove("open"); message(""); });

  Open77.ready();
</script>
</body>
</html>
