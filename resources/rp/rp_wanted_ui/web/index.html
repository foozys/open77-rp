<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Розыск</title>
<style>
  :root { --red: #ff3b4e; --blue: #4aa8ff; --text: #e8f1f2; --muted: #8fa3a8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; color: var(--text);
    font: 16px/1.3 "Segoe UI", Arial, sans-serif; user-select: none; pointer-events: none; }

  /* Справа сверху, как полоса розыска в игре: звёзды и строка фазы. */
  #wanted { position: absolute; top: 34px; right: 44px; text-align: right; display: none; }
  #wanted.on { display: block; }
  #stars { font-size: 30px; letter-spacing: 4px; color: rgba(255, 255, 255, 0.22);
    text-shadow: 0 0 6px rgba(0, 0, 0, 0.8); }
  #stars b { color: var(--red); font-weight: normal; text-shadow: 0 0 12px rgba(255, 59, 78, 0.8); }
  #wanted.scene #stars b { animation: flash 0.6s steps(2) infinite; }
  @keyframes flash { 50% { color: var(--blue); text-shadow: 0 0 12px rgba(74, 168, 255, 0.85); } }
  #line { margin-top: 2px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted);
    text-shadow: 0 0 4px rgba(0, 0, 0, 0.9); }
  #wanted.scene #line { color: var(--red); }
</style>
</head>
<body>
<div id="wanted"><div id="stars"></div><div id="line"></div></div>
<script>
  const $ = id => document.getElementById(id);
  let left = 0, phase = null, timer = null;

  function mmss(sec) {
    sec = Math.max(0, Math.floor(sec));
    return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, "0")}`;
  }
  function line() {
    $("line").textContent = phase === "search" ? `NCPD ищет вас · ${mmss(left)}`
      : phase === "scene" ? "NCPD на месте" : "";
  }

  Open77.on("wanted:state", p => {
    const level = Math.max(0, Math.min(5, Number(p && p.level) || 0));
    clearInterval(timer); timer = null;
    if (!level) { $("wanted").className = ""; return; }
    phase = p.phase || "scene";
    left = Number(p.left) || 0;
    $("stars").innerHTML = "<b>" + "★".repeat(level) + "</b>" + "★".repeat(5 - level);
    $("wanted").className = "on " + phase;
    line();
    if (phase === "search") timer = setInterval(() => { left -= 1; line(); }, 1000);
  });

  Open77.ready();
</script>
</body>
</html>
